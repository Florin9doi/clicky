name: Windows Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build clicky-desktop
        run: cargo build --release -p clicky-desktop

      - name: Rename binary
        run: Rename-Item target/release/clicky-desktop.exe clicky.exe

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: clicky-desktop-windows
          path: clicky.exe
